<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>32 Clip Path</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div.clip {
                background: url(imgs/pittsburgh.jpg)
                            no-repeat center /cover;
                margin: 2rem auto;
                height: 200px;
                width: 340px;
                transition: all 0.5s ease;

                &.clip1 {
                    clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);

                    &:hover {
                        clip-path: polygon(50% 0%, 100% 0, 100% 36%, 100% 64%, 100% 100%, 48% 100%, 0 100%, 0 65%, 0 35%, 0 0);
                    }
                }
                &.clip2 {
                  clip-path: polygon(0% 15%, 15% 15%, 15% 0%, 85% 0%, 85% 15%, 100% 15%, 100% 85%, 85% 85%, 85% 100%, 15% 100%, 15% 85%, 0% 85%);

                  &:hover {
                    clip-path: polygon(0% 15%, 0 0, 15% 0%, 85% 0%, 100% 0, 100% 15%, 100% 85%, 100% 100%, 85% 100%, 15% 100%, 0 100%, 0% 85%);
                  }
                }
                &.clip3 {
                    clip-path: polygon(10% 25%, 35% 25%, 35% 0%, 65% 0%, 65% 25%, 90% 25%, 90% 50%, 65% 50%, 65% 100%, 35% 100%, 35% 50%, 10% 50%);

                    &:hover {
                        clip-path: polygon(0 26%, 0 0, 35% 0%, 65% 0%, 100% 0, 100% 25%, 100% 50%, 100% 100%, 65% 100%, 35% 100%, 0 100%, 0 55%);
                    }
                }
            }
        }
    </style>
</head>

<body class="css">
    <nav class="goback">

            </a>
    </nav>
    <main>
        <header class="mmenu internal">
         <h1>32 Clip Path</h1>
           <img src="/03-css/imgs/logo-css.png">
         <h3>Property lets you clip an element to a basic shape.</h3>
        </header>
        <section>
                <h3 class="subtitle">Example 01:</h3>
                <div class="clip clip1"></div>
                <h3 class="subtitle">Example 02:</h3>
                <div class="clip clip2"></div>
                 <h3 class="subtitle">Example 03:</h3>
                <div class="clip clip3"></div>
        </section>
    </main>
</body>

</html>
